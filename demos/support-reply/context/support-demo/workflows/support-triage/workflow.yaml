slug: support_triage
name: Support Triage
description: >-
  Refreshes the ticket source, collects a reply for one ticket, pauses for
  human approval, and sends it. Summarizing a ticket and drafting a reply
  are skills the support-assistant agent runs in chat (see
  agents/support-assistant.yaml `skills:`) — a workflow step cannot invoke a
  skill directly in the current schema, so drafting happens with the agent
  and the resulting text is brought into this workflow's `draft_reply`
  input (or typed in by hand at the `reply` step) to be reviewed and sent.
version: 1
status: active
trigger:
  type: manual
inputSchema:
  type: object
  required: [ticket]
  properties:
    ticket:
      type: string
      description: Raw inbound ticket body
    customer_name:
      type: string
      description: Customer name (for reference during review)
    customer_email:
      type: string
      description: Customer email address — the send step's recipient
    sender_name:
      type: string
      default: the Support team
    draft_reply:
      type: string
      description: >-
        Reply text already drafted (e.g. by the support-assistant agent's
        summarize_ticket + draft_reply skills in chat). When supplied, the
        `reply` step below completes immediately instead of pausing for a
        human to type one in.
steps:
  - name: refresh_tickets
    type: sync
    sources: [zendesk]

  - name: reply
    type: ask
    prompt: >-
      Paste the drafted reply for this ticket. Draft it with the
      support-assistant agent's summarize_ticket and draft_reply skills
      first, then bring the text here.
    default: '{{input.draft_reply}}'

  - name: review
    type: approve
    prompt: Review the drafted reply before sending.
    reviews: reply

  - name: send
    type: action
    action: gmail.send
    input:
      to: '{{input.customer_email}}'
      subject: 'Re: your support ticket'
      body: '{{steps.reply.output}}'
