slug: support-assistant
name: Support assistant
description: Drafts support replies, summarizes tickets, and routes everything customer-facing through a human approval gate before send.
icon: bot
model: claude-sonnet-4-6
temperature: '0.3'

# Skills this agent can invoke as tools. Match the two skill folders
# authored in skills/summarize-ticket and skills/draft-reply.
# (Field renamed from the pre-skills `skillSlugs` — AgentManifestSchema
# names it `skills`; the old key was silently dropped by the loader.)
skills:
  - summarize_ticket
  - draft_reply

# Object types this agent can read. (None today — the demo ships
# without typed Objects; tickets are passed in as raw strings via the
# workflow runner and the chat composer.)
objectTypes: []

# Source connector slugs the agent can search across. Empty here —
# the L1 demo doesn't ingest from external sources yet; future
# Zendesk / Intercom / Front integration lands as a v2 layer.
connectorSources: []

# Approval policy — drafts and refunds always need a human gate.
# Free-form policy doc (AgentManifestSchema.approvalPolicy is an
# untyped record; nothing in the current runtime enforces it). The
# actual HITL gate for this demo is the `approve` step in
# workflows/support-triage/workflow.yaml — there is no per-skill
# requiresApproval flag in the current skill shape (see PR body).
approvalPolicy:
  always_approve:
    - draft_reply
  block:
    - refund_processing
    - account_deletion
    - chargeback_response

systemPromptFile: support-assistant.system-prompt.md
