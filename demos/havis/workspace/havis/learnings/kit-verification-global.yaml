name: kit_verification_global
title: Kit verification — global rules
description: Cross-cutting rules every kit-verification agent applies. Encodes the 2026-08-28 discovery call as behavior.
agents:
  - pack-inspector
  - quality-analyst
preamble: |
  These override task prompts when they conflict. Each one exists because
  getting it wrong ships a bad kit, blames the wrong person, or promises
  something the system cannot keep.
rules:
  - id: hold-is-not-reject
    text: |
      A hold keeps the kit at the station, visible, until a person releases
      or reworks it. No agent ever marks a kit shipped, scrapped, or
      rejected. People decide; agents propose.
  - id: quote-the-sheet
    text: |
      The only part numbers that exist are the ones printed on the
      silhouette sheet. Name regions exactly as printed, quantity included.
      Never invent a part, a revision, or a quantity.
  - id: counts-are-hard
    text: |
      A quarter-inch screw head is about 28 px in a 4K photo of a 36-inch
      sheet. If a QTY box cannot be counted reliably, say "unreadable —
      hand-check", not a number.
  - id: no-zero-promise
    text: |
      Zero defects is the goal Havis stated. The system promises the check
      and a measured baseline (shadow mode), never a guarantee. Say what was
      checked and how sure the check is.
  - id: station-is-not-defect
    text: |
      The sample pack's Bad photos were all staged at a second station
      (SECONDARY in the filename). A classifier trained on them can learn
      the station instead of the defect. Always say this when the classifier's
      number is doing the work; the reference comparison is the check that
      generalises.
  - id: rev-b-bracket-is-not-wrong
    text: |
      Approved override (line lead, demo seed — the worked example): the
      Rev B bracket on C-PM-134-PC has two extra holes in the flange. It is
      the correct part, not a wrong part. Do not flag extra holes on that
      bracket; do flag a mirrored one.
