slug: kit-photos
name: Pack-station photos (S3)
description: |
  Havis's kit photos in the demo bucket — the sample pack Joe Alderfer sent
  on 2026-08-31 (72 × 4K JPG, two kits), laid out the way production would
  be: templates/<kit-id>/good/ and templates/<kit-id>/bad/ are the labelled
  sets the classifier trains on and the references the comparison uses;
  inbox/ is where new captures land. One document per photo with the kit id,
  label, production order and capture time parsed from the key, plus an
  in-app image URL. Manual sync (no schedule) — trigger from /dashboard/sources.
  Live AWS: bucket tagged Project=havis-demo, TearDown=true.
kind: s3
config:
  bucket: metacto-havis-demo-339712698650
  prefix: templates/
  region: us-east-1
  extensions: ['.jpg', '.jpeg', '.png']
  pathFields: { template_id: 0, known_label: 1 }
  filenamePattern: '^(?<production_order>PD\d+)(?:_(?<station_view>SECONDARY))?_(?<captured_date>\d{4}-\d{2}-\d{2})_(?<captured_time>\d{2}-\d{2}-\d{2})'
enabled: true
