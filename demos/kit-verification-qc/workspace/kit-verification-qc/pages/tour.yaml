# The guided demo — photos arrive → the Pack
# Inspector verifies against references → a person decides in Review →
# the override becomes a training example → the bench.
title: Guided demo
autoStart: false
steps:
  - route: /dashboard/p/command-center
    selector: "#wsx-stats"
    placement: bottom
    title: Every kit photo, one queue
    body: >-
      Your pack stations already take the photo. Here every one is verified
      against verified-good photos of the same kit — no per-kit programming.
      Anything off is held for a person; nothing is rejected by a model.
  - route: /dashboard/p/kit-photos
    selector: "#wsx-stats"
    placement: bottom
    title: Your data, as you sent it
    body: >-
      The sample pack: two kits, good and bad, straight from the fileshare
      into a private bucket. The kit id, production order and capture time
      come from your filenames. We did not touch the images.
  - route: /dashboard/p/template-registry
    selector: "#wsx-table"
    placement: top
    title: Enrolment is one photograph
    body: >-
      A kit is enrolled when it has one verified-good photo. That is the
      whole proposition: the 2,000-SKU wall disappears because nobody
      programs parts.
  - route: /dashboard/agents
    selector: "main > div.flex-1"
    placement: bottom
    title: Two coworkers, and what they may never do
    body: >-
      The Pack Inspector verifies and explains; the Quality Analyst watches
      the stream. Shipping, scrapping, retraining, changing a template — blocked
      for both, in a file, not a promise.
  - route: /dashboard/p/inspection-queue
    selector: "#wsx-table"
    placement: top
    interactive: true
    title: Click a held kit
    body: >-
      The staged bad kits from your pack. Each says which outline, what was
      expected, what was seen, and how sure. Open one, then click Next.
  - route: /dashboard/review
    selector: "main > div.flex-1"
    placement: bottom
    title: A person decides
    body: >-
      Hold, release, rework — proposed by the coworker, decided here, on the
      photo. An override is not an error; it is the signal that teaches the
      standard.
  - route: /dashboard/learnings
    selector: "main > div.flex-1"
    placement: bottom
    title: The standard learns
    body: >-
      The Rev B bracket override became a rule the Inspector applies, and the
      photo was filed as a good example for the next training run — each step
      approved by a person.
  - route: /dashboard/p/agent-registry
    selector: "#wsx-table"
    placement: top
    title: The bench
    body: >-
      Rework routing, supplier quality, shift reports, camera health, template
      authoring from CAD — the roadmap, not the proof stage.
