  - { key: item, label: Item, from: meta.item_number, format: mono }
  - { key: regions, label: Regions on sheet, from: meta.region_count }
  - { key: good, label: Good photos, from: meta.good_examples }
  - { key: bad, label: Labelled defects, from: meta.bad_examples }
  - key: status
    label: Status
    from: status
    format: badge
    tones: { enrolled: ok, pending: muted }
