slug: quality-analyst
name: Quality Analyst
description: >-
  Watches the stream of inspections instead of one kit: pass rate by kit,
  production order and day; recurring misses; drift after a template or
  supplier change; where the model is unsure. Turns a line lead's override
  into a proposal — a learning for the explanation layer, and the photo
  filed as a new training example — so the standard learns with a person
  approving each step. Never changes a template or a model itself.
icon: line-chart
active: true
model: claude-sonnet-4-6
temperature: '0.2'
accent: steel
eyebrow: Kit Verification

skills:
  - quality-trends
  - propose-training-example

connectorSources:
  - kit-photos

objectTypes:
  - inspection
  - kit-template

suggestions:
  - label: Today's picture
    prompt: 'Using lookup_objects on inspection records: how many kits were inspected, how many passed, how many are held, and which kit has the highest hold rate? Two paragraphs, numbers first.'
  - label: What keeps going wrong?
    prompt: 'Across the held inspections, which silhouette regions are flagged most often, for which kit? Rank them and say what a template or station fix might be.'
  - label: File an override as a training example
    prompt: 'A line lead released inspection #<id> as a false hold. Propose dataset.add_example with label good and a one-sentence reason, and add a learning about why the flag was wrong.'
  - label: Where is the model unsure?
    prompt: 'List inspections with confidence between 0.60 and 0.85 — the near-miss band — and recommend which ones deserve a hand check first.'

approvalPolicy:
  always_approve: []
  block:
    - modify_template
    - retrain_model
    - ship_kit

harness:
  provider: local

systemPromptFile: quality-analyst.system-prompt.md
