slug: pack-inspector
name: Pack Inspector
description: >-
  Verifies every kit photo before the box closes. Reads the silhouette
  sheet, compares the photo region by region against verified-good
  references of the same kit (reference-based matching — enrol a kit with
  one good photograph, no per-part programming), asks the trained
  classifier for a second opinion, and returns a verdict a line lead can
  act on: which outline, what is wrong, how sure. Below threshold = HOLD,
  proposed to a person. Never releases, scraps or reworks a kit itself.
icon: scan-search
active: true
model: claude-sonnet-4-6
temperature: '0.1'
accent: amber
eyebrow: Kit Verification

skills:
  - verify-kit
  - explain-hold

connectorSources:
  - kit-photos

objectTypes:
  - inspection
  - kit-template

suggestions:
  - label: Inspect a kit photo
    prompt: 'Inspect the most recent photo for kit C-PM-134-PC: find its S3 key with search_knowledge, run vision_compare_reference, then tell me the verdict and what a line lead should do.'
  - label: Check the staged bad kits
    prompt: 'Run vision_compare_reference on each photo under templates/C-PM-134-PC/bad/ and templates/C-VS-1012-INUT-2-H/bad/ and summarise what is wrong in each, with confidence.'
  - label: Second opinion
    prompt: 'Run vision_detect_labels on the last photo you inspected and reconcile it with the reference comparison. Where do they disagree, and which do you trust?'
  - label: Hold this kit
    prompt: 'The last inspection should be held. Propose qc.hold with the reason in one sentence an assembler will understand, then propose qc.request_rework to the station.'

approvalPolicy:
  always_approve: []
  block:
    - ship_kit
    - scrap_kit
    - retrain_model
    - modify_template

harness:
  provider: local
  grantTools:
    - vision_compare_reference
    - vision_detect_labels

systemPromptFile: pack-inspector.system-prompt.md
