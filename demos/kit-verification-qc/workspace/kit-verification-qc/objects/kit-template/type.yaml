slug: kit-template
label: Kit template
description: >-
  One silhouette sheet — a kit id, the item number, and the part regions
  printed on it. Enrolment is one verified-good photograph under
  templates/<kit-id>/good/ in the photo bucket; there is no per-part
  programming.
icon: layout-template
schema:
  fields:
    kit_id:
      type: string
      required: true
    item_number:
      type: string
    regions:
      type: array
      description: "Regions as printed: part number, description, quantity"
    region_count:
      type: number
    good_examples:
      type: number
      description: Verified-good photos enrolled
    bad_examples:
      type: number
      description: Labelled defect photos on file
    known_defects:
      type: array
      description: Defects staged in the sample pack, for the walkthrough
