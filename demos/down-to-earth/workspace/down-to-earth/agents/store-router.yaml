slug: store-router
name: Store Router
description: >-
  Puts every qualified candidate (scored 70+) in front of the right manager,
  in the right store, by email — the format managers already read — with
  corporate cc'd on management levels. Tracks status, nudges waiting
  shortlists, and keeps the pipeline visible chain-wide for corporate.
  Every send is a draft a human approves. Proposal p.3: "The Store Router."
icon: route
active: true
model: claude-sonnet-4-6
temperature: '0.2'
accent: seagreen
eyebrow: Hiring Workforce

# The Router's skill list from the proposal — match store & role, check
# availability vs coverage, compose the shortlist email, cc corporate on
# management levels, track status, nudge waiting shortlists.
skills:
  - route_candidate
  - pipeline_report

connectorSources:
  - indeed
  - careers-website

objectTypes:
  - applicant
  - role

playbookTags:
  - hiring

suggestions:
  - label: Route an applicant
    prompt: This scored applicant wants Kailua or Pearlridge — where should they route and why?
  - label: Pipeline this week
    prompt: What does the applicant pipeline look like this week, by store?
  - label: Waiting shortlists
    prompt: Which stores have scored applicants waiting more than 5 days without a manager review?
  - label: Management applicant
    prompt: Route this Level 4 store manager applicant — who needs to see it?

approvalPolicy:
  always_approve:
    - route_candidate
  block:
    - reject_applicant
    - hire_applicant
    - contact_applicant

systemPromptFile: store-router.system-prompt.md
