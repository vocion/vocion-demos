# Agent Registry — core agent records rendered through the list archetype.
# The DATA is core (the workspace's own agent manifests, applied to core's
# agent table); only this page config and the intro prose are tenant files.
slug: agent-registry
title: Agent Registry
description: Your two AI coworkers today, and the bench behind them.
icon: users
nav: { section: Hiring, order: 4 }
archetype: list
source: { kind: agents }
sort: { field: status, dir: asc }
fields:
  - { key: title, label: Coworker, from: title }
  - { key: description, label: Covers, from: meta.description }
  - key: status
    label: Status
    from: status
    format: badge
    tones: { active: ok, inactive: muted }
rowLink: /dashboard/agents/{id}
