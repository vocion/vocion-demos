slug: indeed
name: Indeed (demo fixture)
description: |
  Synthetic Indeed applicant feed — ~40 applications as a JSONL fixture,
  the same shape a real Indeed export/webhook would produce. One line =
  one application (resume + application answers). Generated by
  scripts/generate-applicants.mjs; all names and histories are invented.

  When the real Indeed integration ships, swap `kind: file-import` for a
  live connector; the rest of the pipeline (ingest → retrieval → review →
  score → route) is unchanged — same Stripe-test-mode pattern as the
  support-reply demo's zendesk source.

  NOTE: rows carry no pre-computed `embedding` field, so syncing this
  source chunks + embeds via OpenAI — OPENAI_API_KEY required.
kind: file-import
config:
  # Resolved relative to WORKSPACE_PATH (see libs/sources/fileImport.ts) —
  # which is why the fixtures live under workspace/down-to-earth/data/.
  path: ./data/applicants-indeed.jsonl
  format: jsonl
enabled: true
