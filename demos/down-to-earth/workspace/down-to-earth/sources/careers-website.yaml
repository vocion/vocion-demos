slug: careers-website
name: Careers — Join our Team (demo fixture)
description: |
  Synthetic website-application feed — ~20 applications submitted through
  the downtoearth.org "Join our Team" page, as a JSONL fixture. Website
  applications tend to be shorter than Indeed ones (no structured resume
  parse), which is exactly the variance the review agent has to handle.
  Generated by scripts/generate-applicants.mjs; all names invented.

  Swap for a real form/webhook integration when the site is wired; the
  pipeline is unchanged. Sync requires OPENAI_API_KEY (no baked embeddings).
kind: file-import
config:
  path: ./data/applicants-website.jsonl
  format: jsonl
enabled: true
