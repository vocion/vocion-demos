slug: resume-review
name: Resume Review Agent
description: >-
  Reads every application from Indeed and the website — parses the resume
  and application answers, extracts experience, availability, and role fit,
  and confirms the plant-based policy question was acknowledged.
icon: file-search
active: true
model: claude-sonnet-4-6
temperature: '0.2'
accent: seagreen
eyebrow: Hiring Workforce

skills:
  - review_application

connectorSources:
  - indeed
  - careers-website

objectTypes:
  - applicant
  - role

playbookTags:
  - hiring

suggestions:
  - label: Review an application
    prompt: 'Review this application: paste the resume + application answers and I''ll extract the structured profile.'
  - label: What's missing?
    prompt: Which recent applicants are missing availability or the plant-based acknowledgement?
  - label: Search applicants
    prompt: Find applicants with deli or food-handling experience who applied in the last two weeks.

approvalPolicy:
  block:
    - reject_applicant
    - contact_applicant

systemPromptFile: resume-review.system-prompt.md
