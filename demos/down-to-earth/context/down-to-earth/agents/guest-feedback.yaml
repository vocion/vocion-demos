slug: guest-feedback
name: Guest Feedback Triage
description: >-
  Triages Submit Feedback and Contact Us messages across the six stores —
  categorizes, routes to the right store or department, flags what needs a
  person now, and drafts an acknowledgement.
icon: inbox
# Roadmap teaser — inactive while the demo leads with the Hiring Workforce.
active: false
model: claude-sonnet-4-6
temperature: '0.2'
accent: olivedrab
eyebrow: Feedback

skills: []

connectorSources:
  - downtoearth-web

objectTypes: []

playbookTags:
  - storefront

suggestions:
  - label: Triage a message
    prompt: 'Triage this feedback: "Produce at Kakaako looked tired on Sunday afternoon and nobody was restocking."'
  - label: Route it
    prompt: Which store and department should this go to, and how urgent is it?
  - label: Draft an acknowledgement
    prompt: Draft a short acknowledgement for a guest who reported a long checkout line at Pearlridge.

approvalPolicy:
  always_approve:
    - draft_guest_reply
  block:
    - issue_refund
    - issue_gift_card
    - close_without_response

systemPromptFile: guest-feedback.system-prompt.md
