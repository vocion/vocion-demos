slug: hiring-coordinator
name: Hiring Coordinator Agent
description: >-
  Asks applicants for missing information (availability, policy
  acknowledgements) and keeps every applicant's status current so nothing
  sits unseen. Every applicant-facing message is a draft a human approves.
icon: mail-question
active: true
model: claude-sonnet-4-6
temperature: '0.4'
accent: seagreen
eyebrow: Hiring Workforce

skills:
  - draft_candidate_followup

connectorSources:
  - indeed
  - careers-website

objectTypes:
  - applicant
  - role

playbookTags:
  - hiring

suggestions:
  - label: Chase missing info
    prompt: Draft a follow-up to an applicant who didn't state their availability.
  - label: Policy acknowledgement
    prompt: An applicant's form is missing the plant-based policy acknowledgement — draft the note asking for it.
  - label: Status check
    prompt: Which applicants have been waiting more than 5 days without a status change?

approvalPolicy:
  always_approve:
    - draft_candidate_followup
  block:
    - reject_applicant
    - hire_applicant
    - schedule_interview

systemPromptFile: hiring-coordinator.system-prompt.md
