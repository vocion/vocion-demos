slug: store-concierge
name: Store Concierge
description: >-
  Answers guest questions about stores, departments, product standards, DTE
  Perks, deli ordering, and online shopping. Drafts replies for the guest
  services inbox — a human sends.
icon: store
# Roadmap teaser — the proposal sells the Hiring Workforce first; guest-facing
# agents are a "Later · Operations Workforce" beat. Flip to true to demo the
# platform-grows story (proposal p.9/13).
active: false
model: claude-sonnet-4-6
temperature: '0.3'
accent: seagreen
eyebrow: Guest services

# No operations authored yet — the stub answers from playbooks + retrieval.
# Add slugs here as operations/ fills in (e.g. draft_guest_reply).
skills: []

# Public site content, once the source has synced at least once.
connectorSources:
  - downtoearth-web

objectTypes: []

# Mounts every playbook tagged `storefront` into the agent's virtual FS.
playbookTags:
  - storefront

suggestions:
  - label: Store hours
    prompt: What are the hours for the Kailua store?
  - label: Deli pickup
    prompt: How does deli ordering work — can I do curbside at Pearlridge?
  - label: Product standards
    prompt: A guest asked what "natural" means at Down to Earth vs "organic". Draft a reply.
  - label: DTE Perks
    prompt: Explain DTE Perks to a first-time shopper in two sentences.

# Informational until operations exist — the runtime gates per-skill on
# `requiresApproval`. Nothing guest-facing goes out without a human.
approvalPolicy:
  always_approve:
    - draft_guest_reply
  block:
    - issue_refund
    - adjust_perks_balance
    - publish_to_site

systemPromptFile: store-concierge.system-prompt.md
