slug: candidate-scoring
name: Candidate Scoring Agent
description: >-
  Scores each applicant 1–100 against the criteria for that role and level,
  explains why, and applies the threshold rules — below 50 is held from
  routing, never silently deleted. The standard is identical in every store.
icon: gauge
active: true
model: claude-sonnet-4-6
temperature: '0.1'
accent: seagreen
eyebrow: Hiring Workforce

skills:
  - score_candidate

connectorSources:
  - indeed
  - careers-website

objectTypes:
  - applicant
  - role

playbookTags:
  - hiring

suggestions:
  - label: Score an applicant
    prompt: Score this applicant profile against the Deli Clerk (Level 2) criteria and explain the number.
  - label: Why that score?
    prompt: Walk me through why the last applicant scored the way they did — what added and what subtracted.
  - label: Borderline cases
    prompt: Which recent applicants landed between 50 and 69 — worth a second human look?

approvalPolicy:
  block:
    - reject_applicant
    - hire_applicant
    - contact_applicant

systemPromptFile: candidate-scoring.system-prompt.md
