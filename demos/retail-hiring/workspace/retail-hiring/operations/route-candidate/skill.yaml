slug: route_candidate
name: Route Candidate
description: >-
  Decide which store and manager should see a scored applicant (70+) and
  draft the shortlist email — delivered like Indeed's routing today.
  Management levels also route to corporate. Lands in the review queue;
  a human approves before anything sends.
category: mutation
status: active
version: 1
model: claude-sonnet-4-6
temperature: '0.2'
requiresApproval: true
promptFile: prompt.md
inputSchema:
  type: object
  required:
    - profile
    - score
  properties:
    profile:
      type: string
      description: Structured profile from review_application
    score:
      type: string
      description: Score output from score_candidate (number, band, flags)
