slug: draft_candidate_followup
name: Draft Candidate Follow-up
description: >-
  Draft one email to an applicant collecting everything their application
  is missing (availability, store preference, plant-based acknowledgement).
  Never implies an outcome, never mentions the smoking flag. Human approval
  before send.
category: mutation
status: active
version: 1
model: claude-sonnet-4-6
temperature: '0.4'
requiresApproval: true
promptFile: prompt.md
inputSchema:
  type: object
  required:
    - profile
    - missing
  properties:
    profile:
      type: string
      description: Structured profile from review_application
    missing:
      type: string
      description: The list of gaps to collect (from the profile's missing-information section)
