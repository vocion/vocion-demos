slug: applicant
label: Applicant
description: >-
  A job applicant — the unit of work the Hiring Workforce operates on. One
  record per application received from Indeed or the website Careers page.
icon: user
schema:
  fields:
    name:
      type: string
      description: Applicant's name as written on the application
      required: true
    email:
      type: string
      description: Contact email
    role_applied:
      type: string
      description: Role applied for, as stated (e.g. Deli Clerk, Store Manager)
      required: true
    level:
      type: enum
      values: [level-2, level-3, level-4, unclear]
      description: Internal grade mapped from the role (2 entry / 3 supervisor / 4 manager)
    store_preference:
      type: enum
      values: [riverside, lakeside, midtown, harborview, eastgate, westfield, not-stated]
      default: not-stated
    source:
      type: enum
      values: [indeed, website]
      description: Which channel the application arrived through
      required: true
    availability:
      type: string
      description: Days / evenings / weekends as stated; empty if not stated
    plant_based_ack:
      type: enum
      values: [acknowledged, not-acknowledged, question-not-present]
      description: Whether the plant-based policy question was acknowledged on the application
    smokes_or_vapes:
      type: enum
      values: [yes-flagged, 'no', blank]
      description: Answer to the application's smoking/vaping question. Yes/blank = CEO-approval flag, never auto-reject.
    score:
      type: number
      description: 1–100 score from score_candidate; empty until scored
    status:
      type: enum
      values: [received, reviewed, scored, routed, with-manager, decided, held-below-threshold]
      default: received
    applied_at:
      type: datetime
      description: When the application arrived
      required: true
sourceRelevance:
  indeed: 1.0
  careers-website: 1.0
  retail-web: 0.1
classificationPrompt: |
  Given a job application, classify the role family: entry-level (sales
  associate/clerk, cashier, deli clerk), supervisor (department supervisor,
  assistant manager, manager on duty, relief manager), management (store
  manager, deli manager), or other. Classify by the role applied for, not
  by the applicant's history.
