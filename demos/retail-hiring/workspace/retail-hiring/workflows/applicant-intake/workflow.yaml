slug: applicant_intake
name: Applicant Intake
description: >-
  The end-to-end pipeline from the proposal: the Applicant Screener reads
  the application and scores it 1–100 against the role criteria; the Store
  Router routes it to the right store and manager; the run pauses for human
  approval, then sends the shortlist email (stubbed in v1 — v2 wires real
  email the way Indeed routes today). Below the 70 threshold, applicants
  stop at scoring and stay visible with the reason recorded; nothing is
  ever auto-rejected.
version: 1
status: active
trigger:
  type: manual
inputSchema:
  type: object
  required: [application]
  properties:
    application:
      type: string
      description: Raw application text — resume + application answers as received
    source:
      type: string
      default: indeed
      description: indeed | website
steps:
  - name: review
    type: skill
    skill: review_application
    input:
      application: '{{input.application}}'
      source: '{{input.source}}'

  - name: score
    type: skill
    skill: score_candidate
    input:
      profile: '{{steps.review.output}}'
      application: '{{input.application}}'

  # route_candidate itself carries requiresApproval: true; this approve step
  # is the explicit human gate the proposal shows (Approve & route / Adjust /
  # Decline) so the run pauses with the score + draft side-by-side.
  - name: route
    type: skill
    skill: route_candidate
    input:
      profile: '{{steps.review.output}}'
      score: '{{steps.score.output}}'

  - name: manager_review
    type: approve
    prompt: >-
      Review the score and the shortlist routing before the email goes to the
      store manager. Approve, adjust the score, or decline. Smoking/vaping
      flags require the CEO-approval path — never decline on the flag alone.
    reviews: route

  - name: notify_manager
    type: action
    action: stub.email_store_manager
    input:
      to: routed store manager (see route step)
      subject: shortlist notification
      body_from_step: route
